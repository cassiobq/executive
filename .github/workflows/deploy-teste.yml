name: Deploy Preview (/teste)

on:
  push:
    branches: [feature/mapa-insercoes]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          path: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            preview/package-lock.json

      - name: Install & build main
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Install & build preview branch (base /executive/teste/)
        working-directory: preview
        run: |
          npm ci
          npm run build -- --base=/executive/teste/

      - name: Combine main + preview output
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          mkdir -p site/teste
          cp -r preview/dist/. site/teste/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
